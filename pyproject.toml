[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-course"
version = "0.1.0"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "pandas",
    "openpyxl",
    "statsmodels"
]

[tool.setuptools]
packages = ["soil_course"]
